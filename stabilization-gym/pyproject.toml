[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilization-gym"
version = "0.2.0"
description = "Positive-cost task environments with metric-driven formal controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch>=2.0", "gymnasium>=0.29", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]
push = ["shapely"]

[tool.setuptools.packages.find]
include = ["stabilization_gym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
